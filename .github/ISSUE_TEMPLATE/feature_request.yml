name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: It needs no internet permission and no third-party SDK.
          required: true
        - label: It uses public Android APIs only (no root / hidden APIs).
          required: true
