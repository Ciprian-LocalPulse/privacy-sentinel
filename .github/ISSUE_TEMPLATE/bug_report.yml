name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** do not use this form, see SECURITY.md.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sentinel version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Camera detection
        - Microphone detection
        - Suspicious flag / alerts
        - App attribution (Usage access)
        - App audit
        - Boot / background service
        - UI / translation
        - Other
